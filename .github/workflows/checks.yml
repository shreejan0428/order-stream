name: Checks
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm api ruff check orderstream tests benchmarks
      - run: docker compose run --rm -e RUN_INTEGRATION=1 api pytest -q
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
